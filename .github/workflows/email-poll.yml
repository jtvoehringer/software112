name: M365 Webhook Renewal

on:
  schedule:
    # Alle 2 Stunden
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Auch manuell auslösbar

jobs:
  renew-m365-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: M365 Webhook-Subscription erneuern
        run: |
          response=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://software112.icp-consultants.at/api/m365/subscribe)
          echo "HTTP Status: $response"
          if [ "$response" != "200" ]; then
            echo "Webhook-Renewal fehlgeschlagen (HTTP $response)"
            exit 1
          fi
