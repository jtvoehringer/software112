name: E-Mail IMAP-Poll

on:
  schedule:
    # Alle 2 Stunden (GitHub Actions minimum: 5 Minuten)
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Auch manuell auslösbar über GitHub UI

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: IMAP-Posteingang abrufen
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://software112.icp-consultants.at/api/email/poll)
          echo "HTTP Status: $response"
          if [ "$response" != "200" ]; then
            echo "Fehler beim IMAP-Poll (HTTP $response)"
            exit 1
          fi
