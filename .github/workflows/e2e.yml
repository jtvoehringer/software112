name: E2E-Regressionstests

# Playwright-Regressionstests (e2e/, siehe e2e/README.md). Bewusst NICHT bei jedem PR (Actions-Minuten, KAN-269):
#  - nach jedem Merge auf main: staging.yml spiegelt main → staging, Vercel baut die Umgebung „staging“ und meldet das
#    Deployment; darauf laufen hier ALLE Tests (auch schreibende) gegen Staging (eigene Datenbank software112-staging)
#  - manuell (workflow_dispatch): gegen Staging, wahlweise nur lesend
# Läuft nur, wenn Zugangsdaten hinterlegt sind (Secret E2E_WINZER_EMAIL als Schalter „E2E aktiv“).
#
# Produktionsschutz: e2e/umgebung.ts lässt schreibende Tests nur gegen das Staging-Projekt (bzw. einen lokalen
# Supabase-Stack) zu; Produktion und unbekannte Projekte brechen ab. Ziel und Datenbank stehen deshalb hier fest.
#
# Secrets (nur Zugangsdaten): E2E_{TENANT_ADMIN,WINZER,LESER}_{EMAIL,PASSWORT}, E2E_TENANT_ADMIN_TOTP_SECRET
#   (Zwei-Faktor-Pflicht für Admins ab 15.10.2026), E2E_VERCEL_BYPASS (Protection Bypass for Automation).

on:
  workflow_dispatch:
    inputs:
      nur_lesen:
        description: 'Nur lesende Tests (@lesend)'
        type: boolean
        default: false
  deployment_status:

permissions:
  contents: read

concurrency:
  # Staging-Läufe nie parallel (schreibende Tests teilen sich die Datenbank); ein neuer Merge ersetzt einen wartenden Lauf
  group: e2e-staging
  cancel-in-progress: false

jobs:
  vorab:
    # KAN-269: jedes Deployment meldet mehrere Zustände (pending, in_progress, success …) und auch Preview/Production –
    # ohne diese Bedingung startete jeder davon einen Runner. Nur der fertige Staging-Deploy zählt.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging')
    runs-on: ubuntu-latest
    outputs:
      aktiv: ${{ steps.pruefen.outputs.aktiv }}
    steps:
      - id: pruefen
        env:
          SCHALTER: ${{ secrets.E2E_WINZER_EMAIL }}
        run: |
          if [ -n "$SCHALTER" ]; then echo "aktiv=true" >> "$GITHUB_OUTPUT"
          else echo "Keine E2E-Zugangsdaten hinterlegt (Secret E2E_WINZER_EMAIL) – E2E-Tests übersprungen."; echo "aktiv=false" >> "$GITHUB_OUTPUT"; fi

  e2e:
    needs: vorab
    if: needs.vorab.outputs.aktiv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      E2E_BASE_URL: https://staging.software112.icp-consultants.at
      E2E_SUPABASE_URL: https://sjpeghrlhsowmquacjhb.supabase.co
      E2E_NUR_LESEN: ${{ inputs.nur_lesen && '1' || '' }}
      E2E_TENANT_ADMIN_EMAIL: ${{ secrets.E2E_TENANT_ADMIN_EMAIL }}
      E2E_TENANT_ADMIN_PASSWORT: ${{ secrets.E2E_TENANT_ADMIN_PASSWORT }}
      E2E_TENANT_ADMIN_TOTP_SECRET: ${{ secrets.E2E_TENANT_ADMIN_TOTP_SECRET }}
      E2E_WINZER_EMAIL: ${{ secrets.E2E_WINZER_EMAIL }}
      E2E_WINZER_PASSWORT: ${{ secrets.E2E_WINZER_PASSWORT }}
      E2E_WINZER_TOTP_SECRET: ${{ secrets.E2E_WINZER_TOTP_SECRET }}
      E2E_LESER_EMAIL: ${{ secrets.E2E_LESER_EMAIL }}
      E2E_LESER_PASSWORT: ${{ secrets.E2E_LESER_PASSWORT }}
      E2E_LESER_TOTP_SECRET: ${{ secrets.E2E_LESER_TOTP_SECRET }}
      E2E_VERCEL_BYPASS: ${{ secrets.E2E_VERCEL_BYPASS }}
    steps:
      - uses: actions/checkout@v7
        with:
          # nach einem Deploy genau den deployten Stand testen
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Playwright-Tests
        # Systematischer Fehler (z. B. Sitzung ungültig): nach 10 Fehlschlägen abbrechen statt ins Zeitlimit zu laufen
        # (erster Staging-Lauf 10.10.2026: 30 min ohne Fehlertexte, weil der Job vor dem Bericht abgebrochen wurde)
        run: npx playwright test --max-failures=10
      - name: Bericht hochladen
        # auch bei Abbruch durch das Zeitlimit (dann ist failure() falsch)
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            e2e/.ergebnisse/
          retention-days: 7
