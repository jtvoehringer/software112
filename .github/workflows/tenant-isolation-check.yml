name: Prüfungen (verify)

# Läuft bei jedem Push/PR gegen main. Job „check“ = npm run verify (Typprüfung, ESLint, Unit-Tests,
# alle prebuild-Wächter), Job „abhaengigkeiten“ = npm audit. Dieselben Wächter laufen zusätzlich
# bei jedem Vercel-Build blockierend (package.json „prebuild“).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # Seit 28.09.2026 das volle Gate `npm run verify` statt nur fünf Wächtern: Typprüfung des ganzen
    # Programms, ESLint (seit KAN-140; Errors und Warnings über dem Ausgangswert je Regel in
    # scripts/eslint-baseline.json blockieren; im pull_request-Lauf auch Regeln darunter – Ratsche,
    # beim Push auf main nur Hinweis), alle Unit-Tests (scripts/tests/*.test.mjs)
    # und alle acht prebuild-Wächter.
    # Node 24, weil test:csv TypeScript per --experimental-strip-types lädt (ab Node 22).
    # fetch-depth: 0, damit lint:verify origin/main kennt und bei neuen Warnings die Stellen auf
    # geänderten Zeilen zeigen kann (flacher Checkout: nur der Merge-Commit, ohne origin/main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Gate – Typprüfung, Lint, Unit-Tests, Wächter (npm run verify)
        run: npm run verify

  abhaengigkeiten:
    # Sicherheits-Welle 1 (23.9.2026): bekannte Schwachstellen ab Stufe „hoch“ in
    # Produktions-Abhängigkeiten lassen den Lauf rot werden (Vertrag: Updates binnen 14 Tagen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm audit (Produktion, ab Stufe hoch)
        run: npm audit --omit=dev --audit-level=high
